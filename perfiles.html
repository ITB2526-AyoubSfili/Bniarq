<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bniarq | Red de Arquitectos Global</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#030303',
                            card: '#0a0a0a',
                            border: '#1f1f1f',
                            muted: '#a1a1aa'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030303; color: #ffffff; }
    </style>
</head>
<body class="bg-brand-dark text-white selection:bg-blue-600 selection:text-white antialiased">

    <!-- HEADER / NAVBAR -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-brand-dark/90 backdrop-blur-md border-b border-brand-border py-4 px-6 md:px-12 flex items-center justify-between">
        <a href="index.html" class="text-xl font-bold tracking-tighter text-white">bniarq<span class="text-blue-500">.</span></a>
        <a href="index.html" class="bg-brand-card border border-brand-border hover:bg-brand-border text-white text-xs font-bold px-4 py-2 rounded-full transition">Volver al Inicio</a>
    </nav>

    <!-- DIRECTORIO DE PERFILES -->
    <main class="pt-32 pb-24 px-6 md:px-12 max-w-7xl mx-auto">
        <div class="mb-12 text-center">
            <span class="text-xs uppercase tracking-widest text-blue-500 font-bold mb-2 block">Directorio Global</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Red de Profesionales y Estudios</h1>
        </div>

        <!-- Buscador -->
        <div class="max-w-md mx-auto mb-12">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-brand-muted absolute left-4 top-3.5"></i>
                <input type="text" id="searchInput" oninput="filterProfiles()" placeholder="Buscar por nombre, especialidad..." class="w-full bg-brand-card border border-brand-border rounded-xl pl-11 pr-4 py-3 text-xs text-white placeholder-brand-muted focus:border-blue-500 outline-none transition">
            </div>
        </div>

        <!-- Grid de Perfiles sincronizados -->
        <div id="profilesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- SCRIPT PRINCIPAL (MÓDULO FIREBASE) -->
    <script type="module" src="script.js"></script>
</body>
</html>
