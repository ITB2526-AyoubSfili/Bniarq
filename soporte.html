<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bniarq | Panel de Soporte</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%232563eb'/><text x='50' y='68' font-family='sans-serif' font-size='55' font-weight='bold' fill='white' text-anchor='middle'>B</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#030303',
                            card: '#0a0a0a',
                            border: '#1f1f1f',
                            muted: '#a1a1aa'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #030303; color: #ffffff; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #1f1f1f; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #2563EB; }
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 14px;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.hide { transform: translateX(120%); opacity: 0; }
        .toast-success { background: #0a2e1a; border-color: #22c55e; }
        .toast-error { background: #2e0a0a; border-color: #ef4444; }
        .toast-warning { background: #2e1a0a; border-color: #f59e0b; }
        .toast-info { background: #0a1a2e; border-color: #3b82f6; }
        .ticket-card {
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 16px;
            padding: 16px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .ticket-card:hover { border-color: #2563eb; box-shadow: 0 0 30px rgba(37, 99, 235, 0.05); }
        .status-badge { font-size: 9px; padding: 2px 10px; border-radius: 50px; font-weight: 600; text-transform: uppercase; }
        .status-badge.pending { background: #2e1a0a; color: #f59e0b; border: 1px solid #f59e0b; }
        .status-badge.in-progress { background: #0a1a2e; color: #3b82f6; border: 1px solid #3b82f6; }
        .status-badge.resolved { background: #0a2e1a; color: #22c55e; border: 1px solid #22c55e; }
        .btn-accept {
            background: #0a2e1a; color: #22c55e; border: 1px solid #22c55e;
            padding: 6px 16px; border-radius: 50px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-accept:hover { background: #22c55e; color: #000; }
        .btn-resolve {
            background: #0a1a2e; color: #3b82f6; border: 1px solid #3b82f6;
            padding: 6px 16px; border-radius: 50px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-resolve:hover { background: #3b82f6; color: #000; }
        .chat-msg-worker {
            background-color: #1a1a1a; border: 1px solid #262626; color: #e5e5e5;
            border-radius: 12px 12px 12px 2px; padding: 10px 14px; font-size: 0.85rem;
            max-width: 85%; align-self: flex-start; animation: fadeInMsg 0.3s ease; line-height: 1.4;
        }
        .chat-msg-client {
            background-color: #2563EB; color: #ffffff;
            border-radius: 12px 12px 2px 12px; padding: 10px 14px; font-size: 0.85rem;
            max-width: 85%; align-self: flex-end; animation: fadeInMsg 0.3s ease;
        }
        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-overlay-chat {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay-chat.active { display: flex; }
        .modal-content-chat {
            background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 24px;
            max-width: 600px; width: 100%; max-height: 90vh; display: flex; flex-direction: column;
        }
        @media (max-width: 640px) {
            #toast-container { max-width: 90vw; right: 5vw; top: 10px; }
            .toast { font-size: 0.8rem; padding: 12px 16px; }
            .ticket-card { padding: 12px 16px; }
            .modal-content-chat { max-width: 100%; margin: 10px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- HEADER -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-brand-dark/90 backdrop-blur-md border-b border-brand-border py-3 px-4 md:px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-lg md:text-xl font-bold text-white">bniarq<span class="text-blue-500">.</span></span>
            <span class="text-[8px] md:text-[10px] bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded-full">SOPORTE</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="workerStatus" class="text-[10px] md:text-xs text-emerald-400 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Conectado
            </span>
            <a href="index.html" class="text-[10px] md:text-xs text-brand-muted hover:text-white transition">Volver</a>
            <button onclick="logout()" class="text-[10px] md:text-xs text-red-400 hover:text-red-300 transition">Cerrar sesión</button>
        </div>
    </nav>

    <main class="pt-20 pb-12 px-4 md:px-6 max-w-6xl mx-auto">
        <div class="grid grid-cols-3 gap-3 md:gap-4 mb-6">
            <div class="bg-brand-card border border-brand-border rounded-2xl p-4 text-center">
                <p class="text-2xl md:text-3xl font-bold text-white" id="pendingCount">0</p>
                <p class="text-[10px] md:text-xs text-brand-muted uppercase tracking-wider">Pendientes</p>
            </div>
            <div class="bg-brand-card border border-brand-border rounded-2xl p-4 text-center">
                <p class="text-2xl md:text-3xl font-bold text-blue-400" id="activeCount">0</p>
                <p class="text-[10px] md:text-xs text-brand-muted uppercase tracking-wider">En progreso</p>
            </div>
            <div class="bg-brand-card border border-brand-border rounded-2xl p-4 text-center">
                <p class="text-2xl md:text-3xl font-bold text-emerald-400" id="resolvedCount">0</p>
                <p class="text-[10px] md:text-xs text-brand-muted uppercase tracking-wider">Resueltos</p>
            </div>
        </div>

        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="filterTickets('all')" id="tabAll" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition whitespace-nowrap">Todos</button>
            <button onclick="filterTickets('pending')" id="tabPending" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-card border border-brand-border text-brand-muted hover:text-white transition whitespace-nowrap">🕐 Pendientes</button>
            <button onclick="filterTickets('in-progress')" id="tabProgress" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-card border border-brand-border text-brand-muted hover:text-white transition whitespace-nowrap">⚡ En progreso</button>
            <button onclick="filterTickets('resolved')" id="tabResolved" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-card border border-brand-border text-brand-muted hover:text-white transition whitespace-nowrap">✅ Resueltos</button>
        </div>

        <div id="ticketsList" class="space-y-3">
            <p class="text-sm text-brand-muted text-center py-8">Cargando tickets...</p>
        </div>
    </main>

    <!-- MODAL CHAT -->
    <div id="chatModal" class="modal-overlay-chat">
        <div class="modal-content-chat">
            <div class="flex items-center justify-between p-4 border-b border-brand-border shrink-0">
                <div>
                    <h3 id="chatClientName" class="text-sm font-bold text-white">Cliente</h3>
                    <p id="chatTicketId" class="text-[10px] text-brand-muted">Ticket #</p>
                </div>
                <button onclick="closeChatModal()" class="text-brand-muted hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="chatMessagesModal" class="flex-1 p-4 overflow-y-auto space-y-2 min-h-[200px] max-h-[50vh]"></div>
            <div class="p-3 border-t border-brand-border flex gap-2 shrink-0">
                <input type="text" id="chatInputModal" onkeypress="if(event.key==='Enter') sendWorkerMessage()" placeholder="Escribe un mensaje..." class="flex-1 bg-brand-card border border-brand-border rounded-xl px-3 py-2 text-xs text-white placeholder-brand-muted focus:border-blue-500 outline-none">
                <button onclick="sendWorkerMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">Enviar</button>
            </div>
            <div class="p-3 border-t border-brand-border shrink-0">
                <button onclick="resolveTicket()" class="w-full bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-600 hover:text-white text-xs font-bold py-2 rounded-xl transition">
                    ✅ Marcar como resuelto
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
